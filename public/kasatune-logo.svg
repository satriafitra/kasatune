<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="kasa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>
    <linearGradient id="kasa-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00D9F5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="kasa-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#1DB954" />
    </linearGradient>
    <filter id="kasa-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00F5A0" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="32" height="32" rx="8.5" fill="url(#kasa-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="8" stroke="url(#kasa-border)" stroke-width="1" />

  <!-- Modern Soundwave Monogram 'K' -->
  <g filter="url(#kasa-neon)">
    <!-- Vertical Audio Bar -->
    <rect x="6.5" y="6" width="3.5" height="20" rx="1.75" fill="url(#kasa-accent)" />

    <!-- Top-Right Audio Beam -->
    <path d="M11.5 15.5L19.5 7.5" stroke="url(#kasa-accent)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Bottom-Right Audio Beam -->
    <path d="M11.5 16.5L19.5 24.5" stroke="url(#kasa-accent)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Acoustic Soundwave Ripple 1 -->
    <path d="M22.5 12C24 13.5 24 18.5 22.5 20" stroke="url(#kasa-accent)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Acoustic Soundwave Ripple 2 -->
    <path d="M25.5 10C27.8 12.3 27.8 19.7 25.5 22" stroke="url(#kasa-accent)" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.5" />
  </g>
</svg>
